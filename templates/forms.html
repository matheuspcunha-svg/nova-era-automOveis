
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário NOVA ERA MOTORS</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000, #1a1a1a, #000000);
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 600px;

            background: #0d0d0d;

            padding: 35px;

            border-radius: 18px;

            border: 2px solid #d4af37;

            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        h1 {
            text-align: center;

            color: #d4af37;

            margin-bottom: 12px;

            font-size: 28px;

            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        p {
            text-align: center;

            color: white;

            margin-bottom: 30px;

            font-size: 15px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #d4af37;

            font-weight: bold;
        }

        input,
        select {
            width: 100%;

            padding: 14px;

            margin-bottom: 20px;

            border: 1px solid #555;

            border-radius: 8px;

            background: #181818;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #d4af37;

            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        input::placeholder {
            color: #999;
        }

        select {
            cursor: pointer;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #d4af37;

            color: #000;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #ffffff;

            color: #000;

            transform: scale(1.02);

            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        hr {
            margin-top: 30px;

            border: none;

            border-top: 1px solid #d4af37;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 22px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>FORMULÁRIO NOVA ERA MOTORS</h1>

        <p>
            Por favor, preencha os campos abaixo e envie sua solicitação:
        </p>

        <form action="/enviar" method="post">

            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu email"
                required
            >

            <label for="telefone">Telefone:</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="Digite seu telefone"
                required
            >

            <label for="cpf">CPF:</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="Digite seu CPF"
                required
            >

            <label for="DataNascimento">
                Data de Nascimento:
            </label>

            <input
                type="date"
                id="DataNascimento"
                name="DataNascimento"
                required
            >

            <label for="estado">Estado:</label>

            <select id="estado" name="estado" required>

                <option value="">
                    Selecione seu estado
                </option>

                <option>AC</option>
                <option>AL</option>
                <option>AP</option>
                <option>AM</option>
                <option>BA</option>
                <option>CE</option>
                <option>DF</option>
                <option>ES</option>
                <option>GO</option>
                <option>MA</option>
                <option>MT</option>
                <option>MS</option>
                <option>MG</option>
                <option>PA</option>
                <option>PB</option>
                <option>PR</option>
                <option>PE</option>
                <option>PI</option>
                <option>RJ</option>
                <option>RN</option>
                <option>RS</option>
                <option>RO</option>
                <option>RR</option>
                <option>SC</option>
                <option>SP</option>
                <option>SE</option>
                <option>TO</option>

            </select>

            <button type="submit">
                ENVIAR SOLICITAÇÃO
            </button>

            <hr>

        </form>

    </div>

</body>

</html>
