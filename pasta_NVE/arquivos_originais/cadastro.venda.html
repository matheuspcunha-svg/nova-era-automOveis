
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículos | Nova Era Motors</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <h1>Nova Era Motors</h1>
    <p>Cadastro de Veículos</p>
    <nav>
        <a href="{{ url_for('index') }}">Início</a>
    </nav>
</header>

<main>
    <section>
        <h2>Cadastrar Veículo</h2>

        {% if erro %}
            <p class="mensagem-erro">{{ erro }}</p>
        {% endif %}

        {% if mensagem %}
            <p class="mensagem-sucesso">{{ mensagem }}</p>
        {% endif %}

        <form action="{{ url_for('cadastrar_veiculo') }}" method="POST">
            <label for="marca">Marca:</label>
            <input type="text" id="marca" name="marca" required>

            <label for="modelo">Modelo:</label>
            <input type="text" id="modelo" name="modelo" required>

            <label for="ano">Ano:</label>
            <input type="number" id="ano" name="ano" min="1900" max="2100" required>

            <label for="cor">Cor:</label>
            <input type="text" id="cor" name="cor" required>

            <label for="quilometragem">Quilometragem:</label>
            <input type="number" id="quilometragem" name="quilometragem" min="0" required>

            <label for="preco">Preço (R$):</label>
            <input type="number" id="preco" name="preco" min="0.01" step="0.01" required>

            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="">Selecione</option>
                <option value="Disponível">Disponível</option>
                <option value="Vendido">Vendido</option>
                <option value="Reservado">Reservado</option>
            </select>

            <label for="placa">Placa:</label>
            <input type="text" id="placa" name="placa" maxlength="8" required>

            <button type="submit" class="botao">Cadastrar Veículo</button>
        </form>
    </section>
</main>

<footer>
    <p>Nova Era Motors — Excelência em cada detalhe.</p>
</footer>

</body>
</html>
